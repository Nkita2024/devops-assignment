name: CI

on:
  push:
    branches:
      - main
      - feature/github-actions

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirement.txt

      - name: Run tests
        run: pytest app/tests/test_app.py

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit -r app/requirement.txt

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t nikitamishra/flask_image:latest \
            -f app/dockerfile app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nikitamishra/flask_image:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        run: docker push nikitamishra/flask_image:latest

    deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull nikitamishra/flask_image:latest

            docker stop flask_app || true
            docker rm flask_app || true

            docker run -d \
              --name flask_app \
              -p 5000:5000 \
              nikitamishra/flask_app:latest

            sleep 5

            curl -f http://localhost:5000









