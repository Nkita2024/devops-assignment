name: CI

on:
  pull_request:
    branches:
      - main

  push:
   branches:
     - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirement.txt

      - name: Run tests
        run: pytest app/tests/test_app.py

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit -r app/requirement.txt

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t nikitamishra/devops-assignment:latest \
            -f app/dockerfile app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nikitamishra/devops-assignment:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        run: docker push nikitamishra/devops-assignment:latest
