name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirement.txt

      - name: Run unit tests
        run: pytest app/tests/test_app.py

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/requirement.txt


  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t nikitamishra/flask_image:latest \
            -f app/dockerfile app
      
      - name: Start test container
        run: |
          docker run -d \
            --name test_app \
            -p 5000:5000 \
            nikitamishra/flask_image:latest

          sleep 5

      - name: Install test dependencies
        run: pip install -r app/requirement.txt

      - name: Run integration tests
        run: pytest app/tests/test_integration.py

      - name: Stop test container
        if: always()
        run: docker rm -f test_app || true
      
      - name: Docker vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nikitamishra/flask_image:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        run: docker push nikitamishra/flask_image:latest


  staging:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull nikitamishra/flask_image:latest

            docker stop flask_app || true
            docker rm flask_app || true

            docker run -d \
              --name flask_app \
              -p 5000:5000 \
              nikitamishra/flask_image:latest

            sleep 5

            curl -f http://localhost:5000


  production:
    if: github.event_name == 'push'
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull nikitamishra/flask_image:latest

            docker stop flask_app || true
            docker rm flask_app || true

            docker run -d \
              --name flask_app \
              -p 5000:5000 \
              nikitamishra/flask_image:latest

            sleep 5

            curl -f http://localhost:5000
  notify:
    if: always()

    needs:
      - test
      - build
      - staging
      - production

    runs-on: ubuntu-latest

    steps:

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 465

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: GitHub Actions
          to: ${{ secrets.MAIL_USERNAME }}

          secure: true

          subject: "CI/CD Pipeline Notification"

          body: |
            CI/CD Pipeline Notification

            Repository: ${{ github.repository }}

            Branch: ${{ github.ref_name }}

            Commit: ${{ github.sha }}

            --------------------------------

            Test:       ${{ needs.test.result }}
            Build:      ${{ needs.build.result }}
            Staging:    ${{ needs.staging.result }}
            Production: ${{ needs.production.result }}

            --------------------------------

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
