name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirement.txt

      - name: Run unit tests
        run: pytest app/tests/test_app.py

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/requirement.txt


  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t nikitamishra/flask_image:latest \
            -f app/dockerfile app

      - name: Docker vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nikitamishra/flask_image:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        run: docker push nikitamishra/flask_image:latest


  staging:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull nikitamishra/flask_image:latest

            docker stop flask_app || true
            docker rm flask_app || true

            docker run -d \
              --name flask_app \
              -p 5000:5000 \
              nikitamishra/flask_image:latest

            sleep 5

            curl -f http://localhost:5000


  production:
    if: github.event_name == 'push'
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull nikitamishra/flask_image:latest

            docker stop flask_app || true
            docker rm flask_app || true

            docker run -d \
              --name flask_app \
              -p 5000:5000 \
              nikitamishra/flask_image:latest

            sleep 5

            curl -f http://localhost:5000

